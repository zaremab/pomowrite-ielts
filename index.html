<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PomoWrite — IELTS Writing Studio</title>
<style>
:root{--bg:#f5f7f4;--panel:#fff;--ink:#1e2924;--muted:#77827b;--line:#e2e8e2;--accent:#34785c;--soft:#e7f2eb;--danger:#a43b3b;--shadow:0 8px 30px #203c2910}
[data-theme=dark]{--bg:#121815;--panel:#1c2520;--ink:#edf4ee;--muted:#a0afa5;--line:#344139;--accent:#82c5a0;--soft:#253d30;--danger:#ff9a9a;--shadow:0 8px 30px #0003}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;transition:.2s}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:11px;padding:10px 14px;background:var(--accent);color:white;font-weight:650}button.secondary{background:var(--soft);color:var(--ink)}button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}button:disabled{opacity:.45;cursor:not-allowed}input,select,textarea{width:100%;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:11px;outline-color:var(--accent)}textarea{resize:vertical;min-height:110px}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(25px,4vw,36px);letter-spacing:-1px;line-height:1.1;margin-bottom:12px}h2{font-size:21px;letter-spacing:-.4px}h3{font-size:15px}.muted{color:var(--muted)}.small{font-size:12px}.shell{max-width:1200px;margin:auto;padding:22px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px}.brand{display:flex;align-items:center;gap:10px;font-weight:850;font-size:19px;letter-spacing:-.5px}.logo{width:36px;height:36px;border-radius:12px;background:var(--accent);display:grid;place-items:center;color:white}.nav{display:flex;gap:7px;flex-wrap:wrap}.nav button{background:transparent;color:var(--muted)}.nav button.active{background:var(--soft);color:var(--ink)}.hero{display:flex;justify-content:space-between;gap:22px;align-items:end;margin:20px 0 24px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:1.5px;color:var(--accent);text-transform:uppercase;margin-bottom:10px}.hero p{max-width:570px;color:var(--muted);margin-bottom:0}.stats{display:flex;gap:10px}.stat{background:var(--panel);border:1px solid var(--line);padding:13px 16px;border-radius:15px;min-width:100px}.stat strong{font-size:23px;display:block}.stat span{font-size:11px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:19px;box-shadow:var(--shadow)}.topic{display:flex;flex-direction:column;min-height:235px}.topic .bottom{margin-top:auto;padding-top:18px;display:flex;justify-content:space-between;align-items:center;gap:8px}.pill{display:inline-flex;background:var(--soft);color:var(--accent);border-radius:100px;padding:4px 9px;font-size:11px;font-weight:750}.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin-bottom:16px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:18px}.steps{display:flex;gap:7px;margin-bottom:17px}.step{flex:1;padding:12px;border:1px solid var(--line);border-radius:12px;color:var(--muted);background:var(--panel);font-size:13px}.step strong{display:block;font-size:11px;letter-spacing:1px}.step.active{border-color:var(--accent);background:var(--soft);color:var(--ink)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{display:flex;justify-content:space-between;align-items:center;gap:12px}.field{margin:14px 0}.field label{display:block;font-size:12px;font-weight:750;margin-bottom:6px}.editor{min-height:350px;font-size:15px;line-height:1.8}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:10px;flex-wrap:wrap}.sidebar{display:flex;flex-direction:column;gap:13px}.wordcount{font-weight:800}.timer{font-size:35px;font-weight:850;letter-spacing:-1px;text-align:center;padding:12px}.timer-ring{width:140px;height:140px;border-radius:50%;border:6px solid var(--soft);border-top-color:var(--accent);display:grid;place-items:center;margin:8px auto}.timer-ring .timer{font-size:30px}.vocab{border-bottom:1px solid var(--line);padding:10px 0}.vocab:last-child{border:0}.vocab strong{display:block}.vocab span{color:var(--muted);font-size:12px}.feedback{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7}.scoregrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.score{background:var(--soft);padding:13px;border-radius:12px}.score b{display:block;font-size:23px}.score span{font-size:11px;color:var(--muted)}.empty{padding:40px;text-align:center;color:var(--muted)}.workrow{display:grid;grid-template-columns:1fr auto;gap:15px;align-items:center;border-bottom:1px solid var(--line);padding:16px 0}.workrow:last-child{border:0}.notice{background:var(--soft);border-radius:12px;padding:12px 14px;color:var(--ink);font-size:13px}.error{color:var(--danger)}.hide{display:none!important}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.divider{height:1px;background:var(--line);margin:16px 0}.tagrow{display:flex;gap:6px;flex-wrap:wrap}.tag{border:1px solid var(--line);border-radius:9px;padding:5px 8px;font-size:12px;color:var(--muted)}@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.layout{grid-template-columns:1fr}.sidebar{display:grid;grid-template-columns:1fr 1fr}.hero{align-items:start;flex-direction:column}.stats{width:100%}.stat{flex:1}}@media(max-width:560px){.shell{padding:14px}.grid,.two{grid-template-columns:1fr}.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}.sidebar{display:flex}.topbar{align-items:flex-start;flex-direction:column}.nav{width:100%}.nav button{padding:8px}.steps{gap:4px}.step{padding:9px 5px;font-size:11px}.scoregrid{grid-template-columns:1fr 1fr}.workrow{grid-template-columns:1fr}.stat{min-width:0;padding:10px}.stat strong{font-size:20px}}
</style></head>
<body><div class="shell">
<header class="topbar"><div class="brand"><div class="logo">P</div>PomoWrite</div><nav class="nav" id="nav"><button class="active" data-page="home">Topics</button><button data-page="works">My Works</button><button data-page="progress">Progress</button><button data-page="settings">Settings</button></nav><button class="ghost" id="themeBtn" aria-label="Переключить тему">◐ Theme</button></header>
<main id="app"></main>
</div>
<script>
const topics=[
{id:1,title:"Some people believe that technology makes life more complicated. To what extent do you agree or disagree?",cat:"Technology",type:"Agree / disagree",level:"Intermediate",tags:["technology","society"]},
{id:2,title:"Many cities are becoming difficult to live in. What problems does this cause, and what solutions can you suggest?",cat:"Cities",type:"Problem / solution",level:"Intermediate",tags:["urban life","environment"]},
{id:3,title:"Some people think governments should spend more money on public transport than on roads. Discuss both views and give your opinion.",cat:"Transport",type:"Discuss both views",level:"Advanced",tags:["policy","transport"]},
{id:4,title:"In many countries, people are living longer. What are the advantages and disadvantages of this trend?",cat:"Society",type:"Advantages / disadvantages",level:"Intermediate",tags:["ageing","society"]},
{id:5,title:"Some people think children should learn how to manage money at school. To what extent do you agree or disagree?",cat:"Education",type:"Agree / disagree",level:"Beginner",tags:["education","finance"]},
{id:6,title:"More and more people choose to work from home. Do the advantages outweigh the disadvantages?",cat:"Work",type:"Outweigh",level:"Intermediate",tags:["work","technology"]},
{id:7,title:"Plastic pollution is becoming a serious problem. What are the causes, and what measures can be taken to solve it?",cat:"Environment",type:"Problem / solution",level:"Beginner",tags:["pollution","policy"]},
{id:8,title:"Some people believe that the best way to reduce crime is to give longer prison sentences. Others think there are better alternatives. Discuss both views and give your opinion.",cat:"Crime",type:"Discuss both views",level:"Advanced",tags:["justice","society"]},
{id:9,title:"Advertising encourages people to buy things they do not need. To what extent do you agree or disagree?",cat:"Media",type:"Agree / disagree",level:"Intermediate",tags:["consumerism","media"]},
{id:10,title:"University education should be free for everyone. Do you agree or disagree?",cat:"Education",type:"Agree / disagree",level:"Intermediate",tags:["education","government"]},
{id:11,title:"Some people think international tourism is beneficial, while others believe it causes harm. Discuss both views and give your opinion.",cat:"Culture",type:"Discuss both views",level:"Advanced",tags:["tourism","culture"]},
{id:12,title:"The use of artificial intelligence is increasing in the workplace. Do the advantages outweigh the disadvantages?",cat:"Technology",type:"Outweigh",level:"Advanced",tags:["AI","employment"]},
{id:13,title:"In some places, young people are leaving rural areas to live in cities. Why is this happening, and what problems can it cause?",cat:"Cities",type:"Two-part question",level:"Intermediate",tags:["migration","society"]},
{id:14,title:"Some people think the main purpose of science should be to improve people's lives. Others think science should be pursued for its own sake. Discuss both views.",cat:"Science",type:"Discuss both views",level:"Advanced",tags:["research","ethics"]},
{id:15,title:"Schools should teach practical skills such as cooking and managing finances alongside academic subjects. To what extent do you agree?",cat:"Education",type:"Agree / disagree",level:"Beginner",tags:["skills","education"]},
{id:16,title:"Individual actions cannot solve environmental problems; only governments and large companies can make a difference. To what extent do you agree?",cat:"Environment",type:"Agree / disagree",level:"Advanced",tags:["climate","policy"]},
{id:17,title:"People today spend less time with their families than in the past. What are the reasons, and what effects does this have?",cat:"Family",type:"Two-part question",level:"Intermediate",tags:["family","work"]},
{id:18,title:"Some people believe that museums should be entertaining, while others think their educational purpose is more important. Discuss both views.",cat:"Culture",type:"Discuss both views",level:"Intermediate",tags:["museums","education"]}
];
const vocab=[
["play a crucial role","играть ключевую роль","Education plays a crucial role in social mobility."],
["a growing concern","растущая проблема","Air pollution is a growing concern in urban areas."],
["from a long-term perspective","с долгосрочной перспективы","From a long-term perspective, prevention is more cost-effective."],
["allocate resources","распределять ресурсы","Governments should allocate resources more efficiently."],
["a compelling argument","убедительный аргумент","A compelling argument in favour of public transport is its accessibility."],
["mitigate the impact","смягчить последствия","Strict regulations can mitigate the impact of pollution."],
["nevertheless","тем не менее","The policy is expensive; nevertheless, it may be worthwhile."],
["consequently","следовательно","Housing costs rose; consequently, many workers moved away."],
["in contrast","в отличие от этого","In contrast, rural areas often offer more affordable housing."],
["this suggests that","это позволяет предположить, что","This suggests that early intervention is necessary."],
["to a considerable extent","в значительной степени","I agree to a considerable extent with this view."],
["a viable alternative","жизнеспособная альтернатива","Cycling is a viable alternative for short journeys."]
];
const $=s=>document.querySelector(s);const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let state={page:"home",topic:null,stage:1,ideas:"",plan:"",essay:"",analysis:null,filter:"",cat:"All categories",type:"All types",level:"All levels",works:[],timerMode:"work",seconds:1500,running:false,theme:"light",endpoint:"/api",user:""};
try{state.works=JSON.parse(localStorage.getItem("pw-works")||"[]");state.theme=localStorage.getItem("pw-theme")||"light";state.user=localStorage.getItem("pw-user")||""}catch(e){}
let interval=null;document.documentElement.dataset.theme=state.theme;
function saveLocal(){localStorage.setItem("pw-works",JSON.stringify(state.works))}
function wordCount(s){return (s.trim().match(/\b[\w’'-]+\b/g)||[]).length}
function streak(){let days=[...new Set(state.works.map(w=>w.day))].sort().reverse();if(!days.length)return 0;let n=0,d=new Date();d.setHours(0,0,0,0);for(let i=0;i<days.length;i++){let x=new Date(days[i]+"T00:00:00");let diff=Math.round((d-x)/86400000);if(diff===0||diff===1&&n===0){n++;d=x}else if(diff===1){n++;d=x}else break}return n}
function nav(){document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===state.page))}
function render(){nav();let app=$("#app");if(state.page==="home")app.innerHTML=home();else if(state.page==="write")app.innerHTML=write();else if(state.page==="works")app.innerHTML=works();else if(state.page==="progress")app.innerHTML=progress();else app.innerHTML=settings();wire()}
function home(){let cats=["All categories",...new Set(topics.map(t=>t.cat))],types=["All types",...new Set(topics.map(t=>t.type))],levels=["All levels","Beginner","Intermediate","Advanced"];let list=topics.filter(t=>(state.cat==="All categories"||t.cat===state.cat)&&(state.type==="All types"||t.type===state.type)&&(state.level==="All levels"||t.level===state.level)&&t.title.toLowerCase().includes(state.filter.toLowerCase()));return `
<div class="hero"><div><div class="eyebrow">IELTS Writing Task 2 · Writing studio</div><h1>Build your argument.<br>One essay at a time.</h1><p>Практикуйся самостоятельно: от собственных идей до подробной обратной связи. ИИ помогает учиться, а не пишет вместо тебя.</p></div><div class="stats"><div class="stat"><strong>${state.works.length}</strong><span>ESSAYS SAVED</span></div><div class="stat"><strong>${streak()}</strong><span>DAY STREAK</span></div></div></div>
<div class="filters"><input id="searchTopic" placeholder="Поиск тем…" value="${esc(state.filter)}"><select id="catFilter">${cats.map(x=>`<option ${x===state.cat?"selected":""}>${esc(x)}</option>`).join("")}</select><select id="typeFilter">${types.map(x=>`<option ${x===state.type?"selected":""}>${esc(x)}</option>`).join("")}</select><select id="levelFilter">${levels.map(x=>`<option ${x===state.level?"selected":""}>${esc(x)}</option>`).join("")}</select></div>
<div class="grid">${list.map(t=>`<article class="card topic"><div class="between"><span class="pill">${esc(t.cat)}</span><span class="muted small">${esc(t.level)}</span></div><h3 style="margin-top:16px;line-height:1.55">${esc(t.title)}</h3><div class="tagrow">${t.tags.map(x=>`<span class="tag">${esc(x)}</span>`).join("")}</div><div class="bottom"><span class="muted small">${esc(t.type)}</span><button data-start="${t.id}">Start essay ↗</button></div></article>`).join("")}</div>${list.length?"":'<div class="empty">Темы не найдены. Попробуй изменить фильтры.</div>'}
<div class="notice" style="margin-top:18px">Темы — учебные формулировки по распространённым направлениям IELTS Task 2 (образование, технологии, общество, экология и др.). Это не дословная подборка официальных заданий IELTS.</div>`}
function write(){let t=state.topic||topics[0];let title=esc(t.title);return `<div class="between" style="margin:20px 0"><div><div class="eyebrow">Your writing session</div><h1 style="font-size:26px">${title}</h1></div><button class="ghost" id="backHome">← All topics</button></div>
<div class="steps"><button class="step ${state.stage===1?"active":""}" data-stage="1"><strong>01 / THINK</strong>Brainstorming</button><button class="step ${state.stage===2?"active":""}" data-stage="2"><strong>02 / WRITE</strong>Writing</button><button class="step ${state.stage===3?"active":""}" data-stage="3"><strong>03 / REFINE</strong>Polishing</button></div>
${state.stage===1?brainstorm():state.stage===2?writing():polishing()}`}
function brainstorm(){return `<div class="layout"><section class="card"><div class="eyebrow">Stage 01 · Your thinking first</div><h2>What do you think?</h2><p class="muted">Запиши собственные идеи до обращения к ИИ. Не нужно писать идеально — начни с позиции, аргументов и конкретных примеров.</p><div class="field"><label>My position / thesis</label><textarea id="thesis" placeholder="I largely agree because…">${esc(state.thesis||"")}</textarea></div><div class="two"><div class="field"><label>Argument 1 + example</label><textarea id="arg1" placeholder="Main point, why it matters, example…">${esc(state.arg1||"")}</textarea></div><div class="field"><label>Argument 2 + example</label><textarea id="arg2" placeholder="Another reason or counterargument…">${esc(state.arg2||"")}</textarea></div></div><div class="field"><label>Other thoughts / vocabulary</label><textarea id="ideas" placeholder="Questions, examples, counterarguments…">${esc(state.ideas)}</textarea></div><div class="row"><button id="makePlan">Develop my ideas with AI ↗</button><button class="secondary" id="skipPlan">Continue to writing</button></div><p class="muted small" style="margin-top:12px">AI expands your notes into a plan; it should not replace your own reasoning.</p></section><aside class="sidebar"><div class="card"><h3>Essay checklist</h3><p class="muted small">Before writing, make sure you can answer:</p>${["What is my clear position?","Does each paragraph have one main idea?","Can I support claims with examples?","Have I answered every part of the prompt?"].map(x=>`<p class="small">○ ${x}</p>`).join("")}</div><div class="card"><h3>Suggested structure</h3><p class="small"><b>Introduction</b><br><span class="muted">Paraphrase + thesis</span></p><p class="small"><b>Body 1</b><br><span class="muted">Claim → explanation → example</span></p><p class="small"><b>Body 2</b><br><span class="muted">Second claim / counterpoint</span></p><p class="small"><b>Conclusion</b><br><span class="muted">Summarise position, no new ideas</span></p></div></aside></div>`}
function writing(){return `<div class="layout"><section class="card"><div class="between"><div><div class="eyebrow">Stage 02 · Draft independently</div><h2>Your essay</h2></div><span class="pill">Target: 250+ words</span></div><div class="notice" style="margin-bottom:14px"><b>Plan to follow</b><div class="feedback small" style="margin-top:6px">${esc(state.plan||"No AI plan yet. Return to Brainstorming to create one, or write from your own notes.")}</div></div><textarea id="essay" class="editor" placeholder="Write your essay here. Aim for a clear thesis, developed body paragraphs, and a concise conclusion…">${esc(state.essay)}</textarea><div class="toolbar"><div><span class="wordcount" id="wordCount">${wordCount(state.essay)}</span> words <span class="muted small">· Aim for 250–290</span></div><div class="row"><button class="secondary" id="saveDraft">Save draft</button><button id="toPolish">Analyse my essay ↗</button></div></div></section><aside class="sidebar"><div class="card"><div class="eyebrow">Focus timer</div><h3>Pomodoro</h3><div class="timer-ring"><div class="timer" id="timerText">${fmtTime(state.seconds)}</div></div><p class="muted small" style="text-align:center" id="timerLabel">${state.timerMode==="work"?"Focus session · 25 min":"Break · 5 min"}</p><div class="row" style="justify-content:center"><button id="timerToggle">${state.running?"Pause":"Start"}</button><button class="secondary" id="timerReset">Reset</button></div><p class="muted small" style="text-align:center;margin-top:10px">A short break helps sustain concentration.</p></div><div class="card"><h3>Academic language</h3><p class="muted small">Use phrases naturally — clarity matters more than complexity.</p>${vocab.slice(0,6).map(v=>`<div class="vocab"><strong>${v[0]}</strong><span>${v[1]}</span><p class="small" style="margin:4px 0 0">${v[2]}</p></div>`).join("")}<button class="ghost" id="moreVocab" style="width:100%;margin-top:10px">Show more phrases</button><div id="extraVocab" class="hide">${vocab.slice(6).map(v=>`<div class="vocab"><strong>${v[0]}</strong><span>${v[1]}</span><p class="small">${v[2]}</p></div>`).join("")}</div></div></aside></div>`}
function polishing(){let a=state.analysis;return `<div class="layout"><section class="card"><div class="eyebrow">Stage 03 · Learn from feedback</div><h2>Essay review</h2><p class="muted">Анализируй ошибки, редактируй работу и сохраняй версию, к которой можно вернуться.</p><div class="notice" style="margin-bottom:14px"><b>Topic</b><p style="margin:5px 0 0">${esc((state.topic||topics[0]).title)}</p></div><div class="field"><label>Your essay (${wordCount(state.essay)} words)</label><textarea id="essayReview" class="editor">${esc(state.essay)}</textarea></div><div class="row"><button id="runReview">Run AI review</button><button class="secondary" id="saveWork">Save essay + feedback</button><button class="ghost" id="backWriting">← Edit essay</button></div><div id="analysisResult" style="margin-top:20px">${a?renderAnalysis(a):'<div class="empty">AI feedback will appear here after you run the review. Configure your backend in Settings first.</div>'}</div></section><aside class="sidebar"><div class="card"><h3>What the review covers</h3>${["Task Response","Coherence & Cohesion","Lexical Resource","Grammatical Range & Accuracy"].map(x=>`<p class="small">✓ ${x}</p>`).join("")}<div class="divider"></div><p class="muted small">Band scores are estimates for learning, not official IELTS results. A qualified examiner may score differently.</p></div><div class="card"><h3>Revision tip</h3><p class="muted small">Prioritise recurring grammar errors and underdeveloped arguments before replacing words with more advanced vocabulary.</p></div></aside></div>`}
function renderAnalysis(a){if(!a)return "";if(a.error)return `<div class="notice error">${esc(a.error)}</div>`;let scores=a.scores||{};return `<div class="scoregrid">${["Task Response","Coherence & Cohesion","Lexical Resource","Grammar"].map((k,i)=>{let key=["task_response","coherence_cohesion","lexical_resource","grammatical_range_accuracy"][i];return `<div class="score"><span>${k}</span><b>${esc(scores[key]??"—")}</b></div>`}).join("")}</div><div class="notice" style="margin-top:10px"><b>Estimated overall band: ${esc(a.overall??"—")}</b> · <span class="muted small">Unofficial learning estimate</span></div>${["strengths","priority_improvements","grammar","vocabulary","structure","task_response_feedback","revised_examples"].map(k=>a[k]?`<div class="divider"></div><h3>${({"strengths":"What you did well","priority_improvements":"Priority improvements","grammar":"Grammar corrections","vocabulary":"Lexical resource","structure":"Structure & cohesion","task_response_feedback":"Task response","revised_examples":"Examples of revision"})[k]}</h3><div class="feedback">${esc(Array.isArray(a[k])?a[k].map(x=>typeof x==="string"?x:JSON.stringify(x)).join("\\n\\n"):a[k])}</div>`:"").join("")}`}
function works(){return `<div class="hero"><div><div class="eyebrow">Your writing archive</div><h1>My Works</h1><p>Перечитывай, редактируй и сравнивай результаты предыдущих эссе.</p></div><div class="stats"><div class="stat"><strong>${state.works.length}</strong><span>SAVED WORKS</span></div><div class="stat"><strong>${state.works.filter(w=>w.analysis).length}</strong><span>REVIEWED</span></div></div></div><div class="card">${state.works.length?state.works.slice().sort((a,b)=>b.updated.localeCompare(a.updated)).map(w=>`<div class="workrow"><div><div class="between" style="justify-content:flex-start"><span class="pill">${esc(w.topicCat||"IELTS")}</span><span class="muted small">${esc(w.updated)}</span>${w.analysis?`<span class="pill">Band ${esc(w.analysis.overall??"—")}</span>`:""}</div><h3 style="margin:8px 0">${esc(w.title)}</h3><p class="muted small" style="margin:0">${wordCount(w.essay)} words · ${w.analysis?"AI feedback saved":"Draft only"}</p></div><div class="row"><button data-openwork="${w.id}">Open</button><button class="ghost" data-rename="${w.id}">Rename</button><button class="ghost" data-delete="${w.id}">Delete</button></div></div>`).join(""):'<div class="empty"><h3>No essays saved yet</h3>Finish a writing session and save your first essay.</div>'}</div>`}
function progress(){let reviewed=state.works.filter(w=>w.analysis),avg=reviewed.length?reviewed.reduce((s,w)=>s+Number(w.analysis.overall||0),0)/reviewed.length:0;let recent=reviewed.slice().sort((a,b)=>a.updated.localeCompare(b.updated)).slice(-8);return `<div class="hero"><div><div class="eyebrow">Consistency over perfection</div><h1>Your progress</h1><p>Отслеживай привычку писать регулярно и замечай развитие навыков.</p></div></div><div class="grid"><div class="card"><div class="eyebrow">Practice streak</div><h1>${streak()} days</h1><p class="muted small">Дни подряд с сохранённой практикой. Сохраняй работу каждый день, чтобы поддерживать streak.</p></div><div class="card"><div class="eyebrow">Essays written</div><h1>${state.works.length}</h1><p class="muted small">Все сохранённые работы и черновики.</p></div><div class="card"><div class="eyebrow">Average estimated band</div><h1>${avg?avg.toFixed(1):"—"}</h1><p class="muted small">По ${reviewed.length} эссе с AI-оценкой; не официальный результат.</p></div></div><div class="card" style="margin-top:16px"><h2>Band history</h2>${recent.length?`<div class="grid">${recent.map(w=>`<div class="score"><span>${esc(w.updated)}</span><b>${esc(w.analysis.overall??"—")}</b><span>${esc(w.title.slice(0,70))}${w.title.length>70?"…":""}</span></div>`).join("")}</div>`:'<div class="empty">После сохранения эссе с анализом здесь появится история оценок.</div>'}</div>`}
function settings(){return `<div class="hero"><div><div class="eyebrow">Workspace configuration</div><h1>Settings</h1><p>Подключи настоящий AI backend и облачное хранилище. Ключи API нельзя помещать в браузер.</p></div></div><div class="two"><section class="card"><h2>AI service</h2><p class="muted small">Укажи URL backend-сервера, который запускается из этого проекта. В комплекте есть Node.js backend с OpenAI API.</p><div class="field"><label>Backend URL</label><input id="endpoint" value="${esc(state.endpoint)}" placeholder="http://localhost:3000/api"></div><div class="field"><label>Optional learner label</label><input id="userLabel" value="${esc(state.user)}" placeholder="Your name (local only)"></div><button id="testApi">Test AI connection</button><div id="apiStatus" class="small muted" style="margin-top:10px"></div><div class="divider"></div><h3>AI functions</h3><p class="small muted">Create outline from your notes · review essay against four IELTS criteria · receive actionable grammar and vocabulary feedback.</p></section><section class="card"><h2>Data & privacy</h2><p class="muted small">Сейчас работы сохраняются локально в этом браузере. Чтобы синхронизировать между устройствами и сделать вход по аккаунту, настрой Supabase по инструкции в README.</p><div class="notice">Не введи секретные API-ключи в это поле. Backend URL — это адрес сервера, а не ключ.</div><div class="field"><label>Data storage status</label><input disabled value="Local browser storage (localStorage)"></div><button class="secondary" id="exportData">Export my works (JSON)</button><button class="ghost" id="clearData" style="margin-left:6px">Clear local data</button><div class="divider"></div><h3>Theme</h3><p class="muted small">Theme toggle in the header switches light and dark mode. The initial setting follows your device preference.</p></section></div>`}
function fmtTime(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function startTimer(){if(state.running){clearInterval(interval);state.running=false}else{state.running=true;interval=setInterval(()=>{if(state.seconds>0)state.seconds--;else{state.timerMode=state.timerMode==="work"?"break":"work";state.seconds=state.timerMode==="work"?1500:300;clearInterval(interval);state.running=false;alert(state.timerMode==="break"?"Focus session complete. Take a 5-minute break!":"Break complete. Ready for another focus session?")}let t=$("#timerText");if(t)t.textContent=fmtTime(state.seconds);let b=$("#timerToggle");if(b)b.textContent=state.running?"Pause":"Start";let l=$("#timerLabel");if(l)l.textContent=state.timerMode==="work"?"Focus session · 25 min":"Break · 5 min"},1000)}render()}
function collect(){["thesis","arg1","arg2","ideas","essay"].forEach(k=>{let e=$("#"+k);if(e)state[k]=e.value})}
function wire(){
document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>{state.page=b.dataset.page;render()});
document.querySelectorAll("[data-start]").forEach(b=>b.onclick=()=>{state.topic=topics.find(t=>t.id===+b.dataset.start);state.stage=1;state.ideas="";state.thesis="";state.arg1="";state.arg2="";state.plan="";state.essay="";state.analysis=null;state.page="write";render()});
["searchTopic","catFilter","typeFilter","levelFilter"].forEach(id=>{let e=$("#"+id);if(e)e.oninput=()=>{if(id==="searchTopic")state.filter=e.value;if(id==="catFilter")state.cat=e.value;if(id==="typeFilter")state.type=e.value;if(id==="levelFilter")state.level=e.value;let pos=e.selectionStart;render();if(id==="searchTopic"){let n=$("#searchTopic");n.focus();n.setSelectionRange(pos,pos)}}});
document.querySelectorAll("[data-stage]").forEach(b=>b.onclick=()=>{collect();state.stage=+b.dataset.stage;render()});
if($("#backHome"))$("#backHome").onclick=()=>{collect();state.page="home";render()};
if($("#skipPlan"))$("#skipPlan").onclick=()=>{collect();state.stage=2;render()};
if($("#makePlan"))$("#makePlan").onclick=async()=>{collect();await aiRequest("outline")};
if($("#essay"))$("#essay").oninput=()=>{state.essay=$("#essay").value;let w=$("#wordCount");if(w)w.textContent=wordCount(state.essay)};
if($("#saveDraft"))$("#saveDraft").onclick=()=>{collect();persistWork(false);toast("Draft saved locally.")};
if($("#toPolish"))$("#toPolish").onclick=()=>{collect();state.stage=3;state.page="write";render()};
if($("#timerToggle"))$("#timerToggle").onclick=startTimer;
if($("#timerReset"))$("#timerReset").onclick=()=>{clearInterval(interval);state.running=false;state.seconds=state.timerMode==="work"?1500:300;render()};
if($("#moreVocab"))$("#moreVocab").onclick=()=>{$("#extraVocab").classList.toggle("hide");$("#moreVocab").textContent=$("#extraVocab").classList.contains("hide")?"Show more phrases":"Show fewer phrases"};
if($("#essayReview"))$("#essayReview").oninput=()=>state.essay=$("#essayReview").value;
if($("#runReview"))$("#runReview").onclick=async()=>{state.essay=$("#essayReview").value;await aiRequest("review")};
if($("#saveWork"))$("#saveWork").onclick=()=>{state.essay=$("#essayReview").value;persistWork(true);toast("Essay and available feedback saved.")};
if($("#backWriting"))$("#backWriting").onclick=()=>{state.essay=$("#essayReview").value;state.stage=2;render()};
if($("#endpoint"))$("#endpoint").onchange=()=>state.endpoint=$("#endpoint").value.trim().replace(/\/$/,"");
if($("#userLabel"))$("#userLabel").onchange=()=>{state.user=$("#userLabel").value;localStorage.setItem("pw-user",state.user)};
if($("#testApi"))$("#testApi").onclick=async()=>{state.endpoint=$("#endpoint").value.trim().replace(/\/$/,"");let el=$("#apiStatus");el.textContent="Checking…";try{let r=await fetch(state.endpoint+"/health");let d=await r.json();el.textContent=r.ok?"Connected · "+(d.aiConfigured?"AI key configured":"Backend online, but AI key is not configured"):"Connection failed";el.className="small "+(r.ok?"":"error")}catch(e){el.textContent="Cannot connect. Start the backend and check the URL.";el.className="small error"}};
if($("#exportData"))$("#exportData").onclick=()=>{let blob=new Blob([JSON.stringify(state.works,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="pomowrite-works.json";a.click();URL.revokeObjectURL(a.href)};
if($("#clearData"))$("#clearData").onclick=()=>{if(confirm("Delete all locally saved essays? This cannot be undone.")){state.works=[];saveLocal();render()}};
document.querySelectorAll("[data-openwork]").forEach(b=>b.onclick=()=>{let w=state.works.find(x=>x.id===b.dataset.openwork);if(!w)return;state.topic=topics.find(t=>t.id===w.topicId)||{id:w.topicId,title:w.title,cat:w.topicCat||"Saved work",type:"Saved",level:"—",tags:[]};state.editingId=w.id;state.essay=w.essay;state.plan=w.plan||"";state.analysis=w.analysis||null;state.ideas=w.ideas||"";state.thesis=w.thesis||"";state.arg1=w.arg1||"";state.arg2=w.arg2||"";state.stage=3;state.page="write";render()});
document.querySelectorAll("[data-delete]").forEach(b=>b.onclick=()=>{if(confirm("Delete this essay permanently from local storage?")){state.works=state.works.filter(w=>w.id!==b.dataset.delete);saveLocal();render()}});
document.querySelectorAll("[data-rename]").forEach(b=>b.onclick=()=>{let w=state.works.find(x=>x.id===b.dataset.rename);let n=prompt("New essay title",w.title);if(n&&n.trim()){w.title=n.trim();w.updated=new Date().toISOString().slice(0,10);saveLocal();render()}});
}
function toast(s){let d=document.createElement("div");d.className="notice";d.textContent=s;d.style.cssText="position:fixed;bottom:20px;right:20px;z-index:5;box-shadow:var(--shadow)";document.body.append(d);setTimeout(()=>d.remove(),2500)}
function persistWork(withAnalysis){let t=state.topic||topics[0],existing=state.editingId?state.works.find(w=>w.id===state.editingId):null;let w={id:existing?.id||crypto.randomUUID(),topicId:t.id,title:existing?.title||t.title,topicCat:t.cat,essay:state.essay,plan:state.plan,ideas:state.ideas,thesis:state.thesis,arg1:state.arg1,arg2:state.arg2,analysis:withAnalysis?state.analysis:(existing?.analysis||null),updated:new Date().toISOString().slice(0,10),day:new Date().toISOString().slice(0,10)};if(existing)state.works=state.works.map(x=>x.id===w.id?w:x);else state.works.push(w);state.editingId=w.id;saveLocal()}
async function aiRequest(action){let btn=action==="outline"?$("#makePlan"):$("#runReview");if(btn){btn.disabled=true;btn.textContent=action==="outline"?"Building outline…":"Reviewing…"}let payload={action,topic:state.topic?.title||"",ideas:{thesis:state.thesis||"",argument1:state.arg1||"",argument2:state.arg2||"",notes:state.ideas||""},essay:state.essay||"",plan:state.plan||""};try{let r=await fetch(state.endpoint+"/ai",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});let d=await r.json();if(!r.ok)throw Error(d.error||"AI request failed");if(action==="outline"){state.plan=typeof d==="string"?d:(d.plan||JSON.stringify(d,null,2));state.stage=2;render()}else{state.analysis=d.analysis||d;let el=$("#analysisResult");if(el)el.innerHTML=renderAnalysis(state.analysis);toast("AI feedback received. Review and save it.")}}catch(e){alert("AI integration error: "+e.message+"\n\nCheck Settings → Backend URL, start the Node backend, and configure OPENAI_API_KEY in .env. No mock feedback was generated.")}finally{if(btn&&btn.isConnected){btn.disabled=false;btn.textContent=action==="outline"?"Develop my ideas with AI ↗":"Run AI review"}}}
$("#themeBtn").onclick=()=>{state.theme=state.theme==="light"?"dark":"light";document.documentElement.dataset.theme=state.theme;localStorage.setItem("pw-theme",state.theme)};
if(!localStorage.getItem("pw-theme")){state.theme=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=state.theme;matchMedia("(prefers-color-scheme: dark)").addEventListener("change",e=>{if(!localStorage.getItem("pw-theme")){state.theme=e.matches?"dark":"light";document.documentElement.dataset.theme=state.theme}})}
render();
</script></body></html>
